<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WANProxy — WAN optimization proxy demo dashboard with XCodec deduplication, zlib compression, SSH and SOCKS chains."
    />
    <title>WANProxy — WAN Optimization Dashboard</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("wanproxy-theme");
          const theme =
            stored === "light" || stored === "dark" ? stored : "system";
          const dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.add(dark ? "dark" : "light");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
